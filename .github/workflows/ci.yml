name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mymoney_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/mymoney_test
      - run: npx tsx prisma/seed-test.ts
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/mymoney_test
      - run: npm run build
      - run: npm test
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/mymoney_test
      - run: npx playwright install chromium
      - run: npx playwright test
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/mymoney_test
          AUTH_SECRET: my-money-secret-change-in-production-abc123xyz
          AUTH_URL: http://localhost:3005
