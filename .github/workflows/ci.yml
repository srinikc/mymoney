name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  quality:
    name: Lint & TypeCheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx next lint --max-warnings 0
        continue-on-error: true

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run --reporter=verbose

      - name: Build
        run: npx next build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mymoney
          POSTGRES_PASSWORD: mymoney
          POSTGRES_DB: mymoney
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Setup test DB
        env:
          DATABASE_URL: postgresql://mymoney:mymoney@localhost:5432/mymoney
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Start app
        env:
          DATABASE_URL: postgresql://mymoney:mymoney@localhost:5432/mymoney
          NEXTAUTH_SECRET: test-secret
          AUTH_SECRET: test-secret
          E2E: "true"
          PORT: 3005
        run: |
          npx next start &
          sleep 10
          curl --retry 5 --retry-delay 5 http://localhost:3005

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://mymoney:mymoney@localhost:5432/mymoney
        run: npx playwright test
